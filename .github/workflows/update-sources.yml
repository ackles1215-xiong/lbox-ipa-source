name: Update IPA sources

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ipa-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update from stable GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_sources.py
      - name: Validate generated sources
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_sources.py
      - name: Commit changes
        run: |
          if git diff --quiet -- apps.json source.json; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json source.json
          git commit -m "chore: update IPA source metadata"
          git push
